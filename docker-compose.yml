name: memecatch

services:
  postgres:
    image: pgvector/pgvector:pg16
    mem_limit: 1280m
    cpus: 0.50
    shm_size: 256mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: memecatch
      MEMECATCH_DB_PASSWORD: ${MEMECATCH_DB_PASSWORD:?MEMECATCH_DB_PASSWORD is required}
      MEMECATCH_BACKUP_DB_PASSWORD: ${MEMECATCH_BACKUP_DB_PASSWORD:?MEMECATCH_BACKUP_DB_PASSWORD is required}
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=30
      - -c
      - wal_buffers=8MB
    volumes:
      - memecatch-pg:/var/lib/postgresql/data
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./deploy/postgres/00-bootstrap.sql:/sql/00-bootstrap.sql:ro
      - ./deploy/postgres/99-app-identity.sql:/sql/99-app-identity.sql:ro
      - ./deploy/postgres/backup-role.sh:/sql/backup-role.sh:ro
      - ./supabase/migrations:/migrations:ro
    networks: [memecatch]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d memecatch"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app:
    image: ${MEMECATCH_IMAGE:-memecatch:local}
    mem_limit: 2816m
    cpus: 0.75
    environment:
      DATABASE_URL: postgresql://memecatch:${MEMECATCH_DB_PASSWORD}@postgres:5432/memecatch
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://catchmeme.com}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://catchmeme.com}
      MEME_EMBEDDING_RUNTIME: bundled
      MEME_EMBEDDING_REINDEX_ENABLED: ${MEME_EMBEDDING_REINDEX_ENABLED:-false}
      NODE_ENV: production
      ADSENSE_AUTO_ADS_ENABLED: ${ADSENSE_AUTO_ADS_ENABLED:-}
      AUTH_EMAIL_WEBHOOK: ${AUTH_EMAIL_WEBHOOK:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ROLE_ARN: ${AWS_ROLE_ARN:-}
      BEDROCK_MEME_STUDIO_ENABLED: ${BEDROCK_MEME_STUDIO_ENABLED:-}
      BEDROCK_MEME_STUDIO_INPUT_NANO_USD_PER_TOKEN: ${BEDROCK_MEME_STUDIO_INPUT_NANO_USD_PER_TOKEN:-}
      BEDROCK_MEME_STUDIO_OUTPUT_NANO_USD_PER_TOKEN: ${BEDROCK_MEME_STUDIO_OUTPUT_NANO_USD_PER_TOKEN:-}
      CRON_SECRET: ${CRON_SECRET:-}
      CSP_ENFORCE: ${CSP_ENFORCE:-}
      CSP_REPORT_URI: ${CSP_REPORT_URI:-}
      FAIRY_PLUS_ENABLED: ${FAIRY_PLUS_ENABLED:-}
      FAIRY_PLUS_MIN_AMOUNT_KRW: ${FAIRY_PLUS_MIN_AMOUNT_KRW:-}
      FAIRY_PROJECT_SLUG: ${FAIRY_PROJECT_SLUG:-}
      FAIRY_WEBHOOK_SECRET: ${FAIRY_WEBHOOK_SECRET:-}
      GA4_PROPERTY_ID: ${GA4_PROPERTY_ID:-}
      GA4_SERVICE_ACCOUNT_EMAIL: ${GA4_SERVICE_ACCOUNT_EMAIL:-}
      GA4_SERVICE_ACCOUNT_PRIVATE_KEY: ${GA4_SERVICE_ACCOUNT_PRIVATE_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      LATPEED_MEMBERSHIP_PRODUCT_ID: ${LATPEED_MEMBERSHIP_PRODUCT_ID:-}
      LATPEED_WEBHOOK_SECRET: ${LATPEED_WEBHOOK_SECRET:-}
      LOCAL_OBJECT_STORAGE_DIR: ${LOCAL_OBJECT_STORAGE_DIR:-}
      MCP_EVENT_RETRY_TOKEN: ${MCP_EVENT_RETRY_TOKEN:-}
      MCP_GITHUB_WEBHOOK_SECRET: ${MCP_GITHUB_WEBHOOK_SECRET:-}
      MEMECATCH_SIGNING_SECRET: ${MEMECATCH_SIGNING_SECRET:-}
      MEME_CHAT_API_KEY: ${MEME_CHAT_API_KEY:-}
      MEME_CHAT_BASE_URL: ${MEME_CHAT_BASE_URL:-}
      MEME_CHAT_GENERATION_ENABLED: ${MEME_CHAT_GENERATION_ENABLED:-}
      MEME_CHAT_MODEL: ${MEME_CHAT_MODEL:-}
      MEME_CHAT_PROVIDER: ${MEME_CHAT_PROVIDER:-}
      MEME_EMBEDDING_API_KEY: ${MEME_EMBEDDING_API_KEY:-}
      MEME_EMBEDDING_URL: ${MEME_EMBEDDING_URL:-}
      MEME_SEMANTIC_SEARCH_ENABLED: ${MEME_SEMANTIC_SEARCH_ENABLED:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-}
      META_INSTAGRAM_ACCESS_TOKEN: ${META_INSTAGRAM_ACCESS_TOKEN:-}
      META_INSTAGRAM_USER_ID: ${META_INSTAGRAM_USER_ID:-}
      NEXT_PUBLIC_ADSENSE_CLIENT: ${NEXT_PUBLIC_ADSENSE_CLIENT:-}
      NEXT_PUBLIC_COMMUNITY_ENABLED: ${NEXT_PUBLIC_COMMUNITY_ENABLED:-}
      NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
      NEXT_PUBLIC_SUBMISSIONS_OPEN: ${NEXT_PUBLIC_SUBMISSIONS_OPEN:-}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_UNIFI_CLIENT_ID: ${NEXT_PUBLIC_UNIFI_CLIENT_ID:-}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      OBJECT_SIGNING_SECRET: ${OBJECT_SIGNING_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REVIEW_BASE_URL: ${OPENAI_REVIEW_BASE_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      OPENROUTER_MPE_MODEL: ${OPENROUTER_MPE_MODEL:-}
      PLUS_DIGEST_DELIVERY_TOKEN: ${PLUS_DIGEST_DELIVERY_TOKEN:-}
      PLUS_DIGEST_DELIVERY_URL: ${PLUS_DIGEST_DELIVERY_URL:-}
      PLUS_DIGEST_FROM_EMAIL: ${PLUS_DIGEST_FROM_EMAIL:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      RADAR_INSTAGRAM_HASHTAGS: ${RADAR_INSTAGRAM_HASHTAGS:-}
      RADAR_THREADS_TERMS: ${RADAR_THREADS_TERMS:-}
      RADAR_X_TERMS: ${RADAR_X_TERMS:-}
      RELEASE_SHA: ${RELEASE_SHA:-}
      THREADS_ACCESS_TOKEN: ${THREADS_ACCESS_TOKEN:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_REDIRECT_URI: ${TIKTOK_REDIRECT_URI:-}
      UNIFI_PAY_API_KEY: ${UNIFI_PAY_API_KEY:-}
      UNIFI_PAY_API_SECRET: ${UNIFI_PAY_API_SECRET:-}
      UNIFI_PAY_BASE_URL: ${UNIFI_PAY_BASE_URL:-}
      UNIFI_PAY_CALLBACK_BASE_URL: ${UNIFI_PAY_CALLBACK_BASE_URL:-}
      UNIFI_PAY_CHECKOUT_ENABLED: ${UNIFI_PAY_CHECKOUT_ENABLED:-}
      UNIFI_PAY_CURRENCY: ${UNIFI_PAY_CURRENCY:-}
      UNIFI_PAY_ITEM_NAME: ${UNIFI_PAY_ITEM_NAME:-}
      UNIFI_PAY_ITEM_PRICE: ${UNIFI_PAY_ITEM_PRICE:-}
      UNIFI_PAY_RETURN_BASE_URL: ${UNIFI_PAY_RETURN_BASE_URL:-}
      UNIFI_PAY_SERVICE_NAME: ${UNIFI_PAY_SERVICE_NAME:-}
      UNIFI_PAY_STORE_ID: ${UNIFI_PAY_STORE_ID:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VERCEL: ${VERCEL:-}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${VERCEL_AUTOMATION_BYPASS_SECRET:-}
      VERCEL_ENV: ${VERCEL_ENV:-}
      VERCEL_GIT_COMMIT_SHA: ${VERCEL_GIT_COMMIT_SHA:-}
      VERCEL_URL: ${VERCEL_URL:-}
      X_API_BEARER_TOKEN: ${X_API_BEARER_TOKEN:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - memecatch-models:/app/.local/embedding-models
    networks: [memecatch]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mpe-worker:
    build:
      context: .
      dockerfile: Dockerfile.mpe-worker
    image: ${MEMECATCH_WORKER_IMAGE:-memecatch-worker:local}
    mem_limit: 768m
    cpus: 0.40
    environment:
      DATABASE_URL: postgresql://memecatch:${MEMECATCH_DB_PASSWORD}@postgres:5432/memecatch
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://catchmeme.com}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://catchmeme.com}
      AUTH_EMAIL_WEBHOOK: ${AUTH_EMAIL_WEBHOOK:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      OPENROUTER_MPE_MODEL: ${OPENROUTER_MPE_MODEL:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      LOCAL_OBJECT_STORAGE_DIR: ${LOCAL_OBJECT_STORAGE_DIR:-}
      OBJECT_SIGNING_SECRET: ${OBJECT_SIGNING_SECRET:-}
      MPE_WORKER_POLL_MS: ${MPE_WORKER_POLL_MS:-}
      MPE_WORKER_MAX_IDLE_POLL_MS: ${MPE_WORKER_MAX_IDLE_POLL_MS:-}
      MPE_FFMPEG_TIMEOUT_MS: ${MPE_FFMPEG_TIMEOUT_MS:-}
      MPE_FFPROBE_TIMEOUT_MS: ${MPE_FFPROBE_TIMEOUT_MS:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [memecatch]
    restart: unless-stopped

  scheduler:
    build:
      context: ./deploy/scheduler
    mem_limit: 64m
    cpus: 0.05
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    depends_on: [app]
    networks: [memecatch]
    restart: unless-stopped

  backup:
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    mem_limit: 256m
    cpus: 0.10
    environment:
      DATABASE_URL: postgresql://memecatch_backup:${MEMECATCH_BACKUP_DB_PASSWORD}@postgres:5432/memecatch
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BACKUP_BUCKET: ${R2_BACKUP_BUCKET:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [memecatch]
    restart: unless-stopped

networks:
  memecatch:
    name: memecatch

volumes:
  memecatch-pg:
    name: memecatch-pg
  memecatch-caddy:
    name: memecatch-caddy
  memecatch-models:
    name: memecatch-models
