[package]
name = "memecatch-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper = "1.12.0"
