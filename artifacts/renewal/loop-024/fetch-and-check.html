<!DOCTYPE html>
<html>
<head>
    <title>URL Liveness Checker</title>
</head>
<body>
    <h1>URL Liveness Checker</h1>
    <pre id="output"></pre>
    <script>
        const SUPABASE_URL = "https://onjipuldngbdptldkpoe.supabase.co";
        const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9uamlwdWxkbmdiZHB0bGRrcG9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0MzczNTksImV4cCI6MjA5OTAxMzM1OX0.V2Jcyz9OuQwg8DDxR8QK6n78YPyJY-XTYE3hOS-VneM";

        const output = document.getElementById('output');

        function log(msg) {
            output.textContent += msg + '\n';
            console.log(msg);
        }

        async function fetchMemeSources() {
            log('Fetching meme_sources (offset=800, limit=800)...');
            const url = `${SUPABASE_URL}/rest/v1/meme_sources?select=id,source_url&source_url=neq.null&offset=800&limit=800`;

            try {
                const response = await fetch(url, {
                    headers: {
                        'apikey': ANON_KEY,
                        'Authorization': `Bearer ${ANON_KEY}`,
                    }
                });

                if (!response.ok) {
                    log(`Error: ${response.status} ${response.statusText}`);
                    return [];
                }

                const data = await response.json();
                log(`Total rows fetched: ${data.length}`);
                return data;
            } catch (e) {
                log(`Fetch error: ${e.message}`);
                return [];
            }
        }

        function isYouTubeUrl(url) {
            return url.includes('youtube.com') || url.includes('youtu.be');
        }

        async function checkYouTube(url) {
            try {
                const response = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(url)}`);
                return response.ok ? 'ok' : 'dead';
            } catch {
                return 'dead';
            }
        }

        async function checkUrl(url) {
            try {
                const response = await fetch(url, { method: 'HEAD', mode: 'no-cors' });
                return 'ok';
            } catch {
                return 'dead';
            }
        }

        async function main() {
            const sources = await fetchMemeSources();

            // Sample 80 rows at 10-row intervals
            const sampleIndices = [];
            for (let i = 0; i < 80; i++) {
                const idx = i * 10;
                if (idx < sources.length) {
                    sampleIndices.push(idx);
                }
            }
            log(`Sampling ${sampleIndices.length} rows...`);

            const deadUrls = [];
            const byStatus = {
                ok: 0,
                dead: 0,
                blocked: 0,
                timeout: 0,
                private: 0
            };

            for (const idx of sampleIndices) {
                const source = sources[idx];
                const url = source.source_url;
                const memeId = source.id;

                log(`[${idx}/${sources.length - 1}] Checking: ${url}`);

                let verdict = 'ok';
                if (isYouTubeUrl(url)) {
                    verdict = await checkYouTube(url);
                } else {
                    verdict = await checkUrl(url);
                }

                byStatus[verdict]++;

                if (verdict !== 'ok') {
                    deadUrls.push({
                        meme_id: memeId,
                        url: url,
                        verdict: verdict
                    });
                }

                // Wait 0.3 seconds between requests
                await new Promise(resolve => setTimeout(resolve, 300));
            }

            const result = {
                checked: sampleIndices.length,
                byStatus: byStatus,
                deadUrls: deadUrls.slice(0, 40)
            };

            log('\n=== RESULTS ===');
            log(JSON.stringify(result, null, 2));

            // Store in window for retrieval
            window.urlCheckResult = result;
        }

        main();
    </script>
</body>
</html>
