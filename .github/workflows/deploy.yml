name: Image and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
          build-args: |
            RELEASE_SHA=${{ github.sha }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://catchmeme.com' }}
            NEXT_PUBLIC_ADSENSE_CLIENT=${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT }}
            NEXT_PUBLIC_COMMUNITY_ENABLED=${{ vars.NEXT_PUBLIC_COMMUNITY_ENABLED }}
            NEXT_PUBLIC_GA_ID=${{ vars.NEXT_PUBLIC_GA_ID }}
            NEXT_PUBLIC_SUBMISSIONS_OPEN=${{ vars.NEXT_PUBLIC_SUBMISSIONS_OPEN }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_UNIFI_CLIENT_ID=${{ vars.NEXT_PUBLIC_UNIFI_CLIENT_ID }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mpe-worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - id: gate
        env:
          OCI_SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
          OCI_SSH_USER: ${{ secrets.OCI_SSH_USER }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          if [ -z "$OCI_SSH_HOST" ] || [ -z "$OCI_SSH_USER" ] || [ -z "$OCI_SSH_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip when the VM credentials are absent
        if: steps.gate.outputs.skip == 'true'
        run: echo "OCI SSH host, user, or key is absent. Leaving the VM unchanged."
      - name: Deploy on the OCI VM
        if: steps.gate.outputs.skip != 'true'
        env:
          OCI_SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
          OCI_SSH_USER: ${{ secrets.OCI_SSH_USER }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
          MEMECATCH_CADDY: ${{ vars.MEMECATCH_CADDY }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          if [ -z "$OCI_SSH_KNOWN_HOSTS" ]; then
            echo "OCI_SSH_KNOWN_HOSTS is required. Refusing to accept a new host key." >&2
            exit 1
          fi
          case "${MEMECATCH_CADDY}" in
            ""|own) ;;
            *)
              echo "MEMECATCH_CADDY must be empty or own." >&2
              exit 1
              ;;
          esac
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]'):${GITHUB_SHA}"
          worker="${image%%:*}-worker:${GITHUB_SHA}"
          caddy_prefix=""
          if [ -n "$MEMECATCH_CADDY" ]; then
            caddy_prefix="MEMECATCH_CADDY=own "
          fi
          install -m 600 /dev/stdin "$RUNNER_TEMP/oci_key" <<<"$OCI_SSH_KEY"
          install -m 644 /dev/stdin "$RUNNER_TEMP/known_hosts" <<<"$OCI_SSH_KNOWN_HOSTS"
          ssh -i "$RUNNER_TEMP/oci_key" \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$OCI_SSH_USER@$OCI_SSH_HOST" \
            "cd /opt/memecatch && git pull && ${caddy_prefix}MEMECATCH_IMAGE='$image' MEMECATCH_WORKER_IMAGE='$worker' bash scripts/deploy-oci.sh"
