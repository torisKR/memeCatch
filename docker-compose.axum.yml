# Opt-in: the Axum server becomes the public listener and Next moves behind it.
# Without this file nothing changes. See docs/axum-migration/PLAN.md.
#
# scripts/deploy-oci.sh adds this file when MEMECATCH_AXUM=1 and leaves it out
# otherwise (docs/oci-setup.md, "Axum in front of Next"). Set the flag instead
# of passing the file by hand: a deploy without the flag turns `app` back into
# Next and removes the `next` container.
#
# Needs a Docker Compose that knows `!override`, `!reset` and `extends` with
# `depends_on`. It renders on v5.5.0 and has deployed on v5.7.1; the VM runs v5.7.0.

services:
  # The Next app as docker-compose.yml defines it (image, environment, limits,
  # volume), on port 3001. Nothing but `app` talks to it.
  next:
    extends:
      file: docker-compose.yml
      service: app
    environment:
      PORT: "3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]

  # Keeps the service name and port, so Caddy (`reverse_proxy app:3000`) and
  # the scheduler (`http://app:3000/api/cron/*`) need no change.
  app:
    # The deploy agent builds memecatch-server:release-<sha> and names it here.
    # Without the variable compose builds the image under a fixed name, like
    # the scheduler, so `compose up` sees a rebuilt image.
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        RELEASE_SHA: ${RELEASE_SHA:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://catchmeme.com}
        NEXT_PUBLIC_ADSENSE_CLIENT: ${NEXT_PUBLIC_ADSENSE_CLIENT:-}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    image: ${MEMECATCH_SERVER_IMAGE:-memecatch-server:local}
    mem_limit: 256m
    # Every request passes through this container. At 0.25 it was throttled on
    # the routes that query the database at request rates Next alone sustains;
    # 0.35 is the smallest limit measured that was not (docs/oci-setup.md,
    # "Axum's CPU limit"). Proxying a page costs it about 0.05 of a CPU.
    cpus: 0.35
    # Replaces the Next environment instead of merging into it.
    environment: !override
      PORT: "3000"
      UPSTREAM_URL: http://next:3001
      DATABASE_URL: postgresql://memecatch:${MEMECATCH_DB_PASSWORD}@postgres:5432/memecatch
      # The main pool. Two more connections belong to the deadline pool: 6 in all.
      AXUM_DB_POOL_MAX: ${AXUM_DB_POOL_MAX:-4}
      AXUM_DISABLED_ROUTES: ${AXUM_DISABLED_ROUTES:-}
      # The native pages (server/README.md, "Pages") stay Next's until listed here.
      AXUM_PILOT_ROUTES: ${AXUM_PILOT_ROUTES:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      # As for the Next app: both read the `__Secure-` session cookie.
      NODE_ENV: production
      CRON_SECRET: ${CRON_SECRET:-}
      # Keys the view counter and the analytics events (server/src/routes/
      # tracking.rs). Without it those two routes stay Next's.
      MEMECATCH_SIGNING_SECRET: ${MEMECATCH_SIGNING_SECRET:-}
      # The semantic search route (server/src/routes/search/) reads both, as
      # Next does. Without MEME_SEMANTIC_SEARCH_ENABLED it answers the keyword
      # fallback with reason "disabled" where Next says "model_unavailable".
      # The BEDROCK_* and AWS_* variables are not passed: the operator studio
      # stays Next's until its credential source is known (PLAN.md row 61).
      MEME_SEMANTIC_SEARCH_ENABLED: ${MEME_SEMANTIC_SEARCH_ENABLED:-}
      MEME_EMBEDDING_URL: ${MEME_EMBEDDING_URL:-}
      # Read at run time by Next too (components/adsense-script.tsx).
      ADSENSE_AUTO_ADS_ENABLED: ${ADSENSE_AUTO_ADS_ENABLED:-}
      # The saved-state emails (server/src/routes/ops/saved_state.rs), as the
      # Next app gets them. Without the URL and sender the cron answers
      # not_configured, as Next does.
      PLUS_DIGEST_DELIVERY_TOKEN: ${PLUS_DIGEST_DELIVERY_TOKEN:-}
      PLUS_DIGEST_DELIVERY_URL: ${PLUS_DIGEST_DELIVERY_URL:-}
      PLUS_DIGEST_FROM_EMAIL: ${PLUS_DIGEST_FROM_EMAIL:-}
      # RELEASE_SHA, NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_GA_ID and
      # NEXT_PUBLIC_ADSENSE_CLIENT are left out on purpose. Next fixes them at
      # build time, and Axum must run with the same ones for native routes and
      # pages to match. They are build args of both images, kept in the image
      # environment, so a release's two images agree whatever .env holds.
      # CSP_ENFORCE and CSP_REPORT_URI are left out too: the Next image is
      # built without them, and a runtime value does not change what Next
      # sends, so passing one here would make native routes differ.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      OBJECT_SIGNING_SECRET: ${OBJECT_SIGNING_SECRET:-}
      LOCAL_OBJECT_STORAGE_DIR: ${LOCAL_OBJECT_STORAGE_DIR:-}
    volumes: !reset []
    depends_on:
      postgres:
        condition: service_healthy
      next:
        condition: service_healthy
    healthcheck:
      # The runtime image has no curl or node; bash can open the socket.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3000 && printf 'GET /api/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 12
