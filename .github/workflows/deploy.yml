name: Image and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - id: gate
        env:
          OCI_SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
          OCI_SSH_USER: ${{ secrets.OCI_SSH_USER }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          if [ -z "$OCI_SSH_HOST" ] || [ -z "$OCI_SSH_USER" ] || [ -z "$OCI_SSH_KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip when the VM secrets are absent
        if: steps.gate.outputs.skip == 'true'
        run: echo "OCI_SSH_HOST, OCI_SSH_USER, or OCI_SSH_KEY is absent. Leaving the VM unchanged."
      - name: Deploy on the shared VM
        if: steps.gate.outputs.skip != 'true'
        env:
          OCI_SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
          OCI_SSH_USER: ${{ secrets.OCI_SSH_USER }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]'):${GITHUB_SHA}"
          install -m 600 /dev/stdin "$RUNNER_TEMP/oci_key" <<<"$OCI_SSH_KEY"
          ssh -i "$RUNNER_TEMP/oci_key" -o StrictHostKeyChecking=accept-new "$OCI_SSH_USER@$OCI_SSH_HOST" \
            "cd /opt/memecatch && git pull && MEMECATCH_IMAGE='$image' bash scripts/deploy-oci.sh"
