packages:
  - .

# Preserve the project's security pins with pnpm 11+, which ignores package.json#pnpm.
overrides:
  'axios@>=1.0.0 <1.18.0': '1.19.0'
  'brace-expansion@<2': '1.1.18'
  'brace-expansion@>=4 <6': '5.0.9'
  'baseline-browser-mapping@>=2 <3': '2.11.0'
  'browserslist@<=4.28.6': '4.28.7'
  'js-yaml@>=4 <5': '4.3.2'
  'undici@>=7 <8': '7.29.0'

allowBuilds:
  '@reown/appkit': false
  core-js: false
  # CPU native binaries ship in the tarball; skip optional CUDA downloads.
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  unrs-resolver: false
