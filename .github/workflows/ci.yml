name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm test
      - run: node scripts/check-env-manifest.mjs
      - run: pnpm build
      - run: bash scripts/standalone-hangul-proxy.test.sh
      - name: Build the app image with the public release values
        env:
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_COMMUNITY_ENABLED: ${{ vars.NEXT_PUBLIC_COMMUNITY_ENABLED }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_SUBMISSIONS_OPEN: ${{ vars.NEXT_PUBLIC_SUBMISSIONS_OPEN }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_UNIFI_CLIENT_ID: ${{ vars.NEXT_PUBLIC_UNIFI_CLIENT_ID }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
        run: |
          docker build -t memecatch:ci \
            --build-arg RELEASE_SHA="${RELEASE_SHA}" \
            --build-arg NEXT_PUBLIC_SITE_URL="${NEXT_PUBLIC_SITE_URL:-https://catchmeme.com}" \
            --build-arg NEXT_PUBLIC_ADSENSE_CLIENT="${NEXT_PUBLIC_ADSENSE_CLIENT}" \
            --build-arg NEXT_PUBLIC_COMMUNITY_ENABLED="${NEXT_PUBLIC_COMMUNITY_ENABLED}" \
            --build-arg NEXT_PUBLIC_GA_ID="${NEXT_PUBLIC_GA_ID}" \
            --build-arg NEXT_PUBLIC_SUBMISSIONS_OPEN="${NEXT_PUBLIC_SUBMISSIONS_OPEN}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL}" \
            --build-arg NEXT_PUBLIC_UNIFI_CLIENT_ID="${NEXT_PUBLIC_UNIFI_CLIENT_ID}" \
            --build-arg NEXT_PUBLIC_VAPID_PUBLIC_KEY="${NEXT_PUBLIC_VAPID_PUBLIC_KEY}" \
            .
      - run: docker build -f Dockerfile.mpe-worker -t memecatch-worker:ci .
      - run: docker run --rm --entrypoint node memecatch-worker:ci --experimental-strip-types --import ./scripts/register-ts-paths.mjs scripts/worker-import-smoke.mjs
      - run: docker build -f deploy/backup/Dockerfile -t memecatch-backup:ci .
      - run: bash scripts/postgres/migrate-from-supabase.test.sh
      - run: bash scripts/postgres/enum-in-filter.test.sh
      - run: bash scripts/postgres/backup-role-readonly.test.sh
      - run: bash deploy/backup/ci-test-restore.sh
