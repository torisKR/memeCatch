# Opt-in, on top of docker-compose.axum.yml: Axum answers every request
# itself and Next does not run (docs/axum-migration/PLAN.md, C1 and C2).
#
# scripts/deploy-oci.sh adds this file after docker-compose.axum.yml when
# MEMECATCH_AXUM=1 and MEMECATCH_NEXT=0, and removes the `next` container an
# earlier deploy left (docs/oci-setup.md, "Axum without Next"). Set the flags
# instead of passing the files by hand.

services:
  # Kept defined (docker-compose.axum.yml extends it) but in a profile that is
  # never activated, so `docker compose up` neither builds nor starts it.
  next:
    profiles: [next]

  app:
    # C1's mode: no upstream. The routes Axum has no port of answer 501 with
    # `x-axum-not-ported` instead of reaching Next, and every page is on.
    environment:
      UPSTREAM_URL: ""
      AXUM_NO_UPSTREAM: "true"
    depends_on: !override
      postgres:
        condition: service_healthy
