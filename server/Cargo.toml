[package]
name = "memecatch-server"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-credential-types = "1.3.1"
aws-sigv4 = { version = "1.6.6", default-features = false, features = ["sign-http", "http1"] }
axum = "0.8.9"
base64 = "0.22.1"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
# The reason phrase of an HTTP/1 answer (`hyper::ext::ReasonPhrase`); already
# in the build through axum.
hyper = { version = "1.12.0", default-features = false, features = ["http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
maud = "0.27.0"
percent-encoding = "2.3.2"
rand = "0.10.4"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: a number in a request body must become the double
# JavaScript's JSON.parse makes of it (routes/request.rs).
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres"] }
subtle = "2.6.1"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-normalization = "0.1.26"
url = "2.5.9"

[dev-dependencies]
http-body-util = "0.1.5"
hyper = "1.12.0"
tempfile = "3.27.0"
