name: CI

on:
  pull_request:
  push:
    branches: [main]

# Public repository: the token stays read-only and CI holds no deploy secrets.
permissions:
  contents: read

jobs:
  # The TypeScript checks, the worker and backup images, the deploy scripts.
  # Every deploy needs it: the mpe-worker and the scripts are TypeScript. The
  # deploy agent asks for this run by name.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      # A static FFmpeg 7.1 (ffmpeg and ffprobe, with libx264, AAC and libass),
      # pinned by the image's linux/amd64 digest and by the two binaries'
      # SHA-256, and cached. The apt install it replaces timed out on five
      # Ubuntu mirrors. The tests need ffmpeg >= 5.1 (`-fps_mode`), ffprobe,
      # lavfi, libx264, AAC and ASS subtitles.
      - name: Restore the pinned FFmpeg
        uses: actions/cache@v4
        with:
          path: ~/.cache/static-ffmpeg
          key: static-ffmpeg-32dfd1df302753d47fb4a87344b5ba005c9cae8e58b4d842959fc387fd004a01
      - name: Install FFmpeg (static 7.1, pinned)
        env:
          FFMPEG_IMAGE: mwader/static-ffmpeg@sha256:32dfd1df302753d47fb4a87344b5ba005c9cae8e58b4d842959fc387fd004a01
          FFMPEG_SHA256: 778c39efedc77e511fe9f94e845a01e20b3d29a0bb678e558f86d2fb3617c506
          FFPROBE_SHA256: 7da066994ba0b197ab708ce5623b739a67cabb4fb902431672fd2085642f54c2
        run: |
          set -euo pipefail
          dir="$HOME/.cache/static-ffmpeg"
          verify() {
            printf '%s  %s\n' "$FFMPEG_SHA256" "$dir/ffmpeg" "$FFPROBE_SHA256" "$dir/ffprobe" | sha256sum -c --quiet -
          }
          if ! verify 2>/dev/null; then
            mkdir -p "$dir"
            for attempt in 1 2 3; do
              timeout 300 docker pull -q "$FFMPEG_IMAGE" && break
              [ "$attempt" = 3 ] && exit 1
              sleep 15
            done
            id="$(docker create "$FFMPEG_IMAGE" /ffmpeg)"
            docker cp "$id:/ffmpeg" "$dir/ffmpeg"
            docker cp "$id:/ffprobe" "$dir/ffprobe"
            docker rm "$id" >/dev/null
            verify
          fi
          echo "$dir" >>"$GITHUB_PATH"
          "$dir/ffmpeg" -version | head -n 1
      - run: pnpm test
      - run: node --test scripts/import-sheet-snapshot.test.mjs scripts/prepare-sheet-source-candidates.test.mjs scripts/youtube-response.test.mjs scripts/source-publication-contract.test.mjs
      - run: node scripts/check-env-manifest.mjs
      - run: bash scripts/deploy-oci.test.sh
      - run: bash deploy/autodeploy/autodeploy.test.sh
      - run: docker build -f Dockerfile.mpe-worker -t memecatch-worker:ci .
      - run: docker run --rm --entrypoint node memecatch-worker:ci --experimental-strip-types --import ./scripts/register-ts-paths.mjs scripts/worker-import-smoke.mjs
      - run: docker build -f deploy/backup/Dockerfile -t memecatch-backup:ci .
      - run: bash scripts/postgres/enum-in-filter.test.sh
      - run: bash scripts/postgres/backup-role-readonly.test.sh
      - run: bash scripts/postgres/community-upload-quota.test.sh
      - run: bash scripts/postgres/instagram-post-video-verification.test.sh
      - run: bash scripts/postgres/db-missing-functions.test.sh
      - run: bash deploy/backup/ci-test-restore.sh

  # CD: on a push to main, once the jobs that check what the VM ships have
  # passed, ask the VM's deploy agent to deploy this commit
  # (.github/workflows/deploy-vm.yml). The agent asks for the `check` and
  # `server` check runs by name; `behaviour` gates this call only.
  deploy:
    needs: [check, server, behaviour]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-vm.yml
    secrets: inherit

  # The server in server/: it answers every request. In `deploy`'s `needs`,
  # and the deploy agent asks for this job's check run by name as well.
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    env:
      # Same Rust release as the build stage of Dockerfile.server.
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: server-cargo-${{ runner.os }}-${{ hashFiles('server/Cargo.lock') }}
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      # The embedded stylesheet and scripts are built from server/ui (and the
      # few lib/ modules it shares with the worker); this fails when they were
      # not rebuilt after a change.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: node server/scripts/build-ui.mjs --check
        working-directory: .
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: cargo test against the Docker test database
        run: |
          DATABASE_URL="$(scripts/test-db.sh up)"
          export DATABASE_URL
          cargo test
      - name: Build the server image as the VM's deploy agent does
        working-directory: .
        env:
          RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A Dockerfile.server that does not build must fail here, not on the
          # VM. The agent builds it with the public build args
          # (deploy/build.env) and reads the release from the image
          # environment; the values the server reads must arrive there.
          args=()
          while IFS='=' read -r key value; do
            [[ -z "$key" || "$key" == \#* ]] || args+=(--build-arg "${key}=${value}")
          done <deploy/build.env
          docker build -f Dockerfile.server -t memecatch-server:ci \
            --build-arg RELEASE_SHA="${RELEASE_SHA}" "${args[@]}" .
          [ "$(docker run --rm memecatch-server:ci printenv RELEASE_SHA)" = "${RELEASE_SHA}" ]
          for key in NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_GA_ID NEXT_PUBLIC_ADSENSE_CLIENT NEXT_PUBLIC_COMMUNITY_ENABLED NEXT_PUBLIC_SUBMISSIONS_OPEN; do
            [ "${key}=$(docker run --rm memecatch-server:ci printenv "${key}")" = "$(grep -m1 "^${key}=" deploy/build.env)" ]
          done

  # The behaviour scenarios (server/behaviour/README.md): a release build of
  # this commit's server, a fresh database from the migrations with the
  # standard seeds, the OpenAI stub on loopback, and Playwright's Chromium
  # at a phone and a desktop width. Nothing leaves the runner. In `deploy`'s
  # `needs`.
  behaviour:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Same Rust release as the build stage of Dockerfile.server.
      RUSTUP_TOOLCHAIN: "1.96.0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: behaviour-cargo-${{ runner.os }}-${{ hashFiles('server/Cargo.lock') }}
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The headless Chromium of the installed Playwright, cached by version;
      # the system libraries it needs are installed every time.
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >>"$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: cargo build --release
        working-directory: server
      - name: The scenarios
        timeout-minutes: 40
        run: server/behaviour/run.sh
