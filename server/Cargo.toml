[package]
name = "memecatch-server"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-credential-types = "1.3.1"
aws-sigv4 = { version = "1.6.6", default-features = false, features = ["sign-http", "http1"] }
axum = "0.8.9"
base64 = "0.22.1"
bcrypt = { version = "0.19", default-features = false, features = ["std"] }
# MarkdownBody of the community pages (src/markdown.rs). Pinned: its
# parse decides the markup tests/markdown_parity.rs compares; no syntect.
comrak = { version = "=1.2.0", default-features = false }
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
# The reason phrase of an HTTP/1 answer (`hyper::ext::ReasonPhrase`); already
# in the build through axum.
hyper = { version = "1.12.0", default-features = false, features = ["http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
icu_collator = "2.4.0"
# `/_next/image` without Next (src/standalone/image.rs): decode, resize and
# re-encode PNG, JPEG and WebP sources, pure Rust. No AVIF (it would need a C
# decoder): an AVIF source is answered unchanged.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
icu_locale_core = "2.4.0"
# Grapheme, word and line break properties for the Open Graph text
# (src/og/satori); already in the build through icu_collator.
icu_properties = "2.4.0"
# PNG photos of the Open Graph cards (src/og/photo): the app's own reader
# needs an inflate, Next's rasterizer reads any PNG. Both already in the
# build through resvg.
fdeflate = "0.3.7"
png = "0.18.1"
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
maud = "0.27.0"
percent-encoding = "2.3.2"
rand = "0.10.4"
# Open Graph cards (src/og): SVG to PNG without text or system fonts; the
# glyphs are paths drawn from the embedded fonts by ttf-parser.
resvg = { version = "0.50.0", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
scrypt = { version = "0.12", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: a number in a request body must become the double
# JavaScript's JSON.parse makes of it (routes/request.rs).
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres"] }
subtle = "2.6.1"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ttf-parser = "0.25.1"
unicode-normalization = "0.1.26"
url = "2.5.9"
# The lossy WebP that Next's optimizer (sharp) sends to browsers that accept
# it. No pure-Rust lossy encoder with a compatible licence exists (zenwebp is
# AGPL); this one builds the vendored libwebp (BSD-3-Clause) with cc.
webp = { version = "=0.3.1", default-features = false }
# Already in the build through hyper-rustls; named here so outbound HTTPS can
# add AXUM_EXTRA_CA_CERTS to the same roots (outbound.rs).
webpki-roots = "1.0.12"
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["load-dynamic"] }
ort-sys = { version = "=2.0.0-rc.9", default-features = false }

[dev-dependencies]
http-body-util = "0.1.5"
hyper = "1.12.0"
tempfile = "3.27.0"

# The Open Graph rasterizer is CPU-bound; unoptimized, the card tests
# (tests/og_cards.rs) take minutes.
[profile.dev.package.resvg]
opt-level = 3
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
[profile.dev.package.usvg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3
# Password hashing (routes/better_auth/passwords.rs) is far too slow
# unoptimized for the tests; the release build is unaffected.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.blowfish]
opt-level = 3
[profile.dev.package.bcrypt]
opt-level = 3
