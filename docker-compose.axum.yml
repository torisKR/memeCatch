# Opt-in: the Axum server becomes the public listener and Next moves behind it.
# Without this file nothing changes. See docs/axum-migration/PLAN.md.
#
# scripts/deploy-oci.sh adds this file when MEMECATCH_AXUM=1 and leaves it out
# otherwise (docs/oci-setup.md, "Axum in front of Next"). Set the flag instead
# of passing the file by hand: a deploy without the flag turns `app` back into
# Next and removes the `next` container.
#
# Needs a Docker Compose that knows `!override`, `!reset` and `extends` with
# `depends_on`. It renders on v5.5.0 and has deployed on v5.7.1; the VM runs v5.7.0.

services:
  # The Next app as docker-compose.yml defines it (image, environment, limits,
  # volume), on port 3001. Nothing but `app` talks to it.
  next:
    extends:
      file: docker-compose.yml
      service: app
    environment:
      PORT: "3001"
      # Decides which server answers the stateful ChatGPT operator routes
      # (PLAN.md section 14): Axum leaves them to Next when it is set, so both
      # must get the same value. docker-compose.yml does not pass it to Next;
      # server/tests/compose_env.rs fails if the two ever differ.
      MCP_EVENT_STATE_KEY: ${MCP_EVENT_STATE_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]

  # Keeps the service name and port, so Caddy (`reverse_proxy app:3000`) and
  # the scheduler (`http://app:3000/api/cron/*`) need no change.
  app:
    # The deploy agent builds memecatch-server:release-<sha> and names it here.
    # Without the variable compose builds the image under a fixed name, like
    # the scheduler, so `compose up` sees a rebuilt image.
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        RELEASE_SHA: ${RELEASE_SHA:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://catchmeme.com}
        NEXT_PUBLIC_ADSENSE_CLIENT: ${NEXT_PUBLIC_ADSENSE_CLIENT:-}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_COMMUNITY_ENABLED: ${NEXT_PUBLIC_COMMUNITY_ENABLED:-}
        NEXT_PUBLIC_SUBMISSIONS_OPEN: ${NEXT_PUBLIC_SUBMISSIONS_OPEN:-}
    image: ${MEMECATCH_SERVER_IMAGE:-memecatch-server:local}
    mem_limit: 256m
    # Every request passes through this container. At 0.25 it was throttled on
    # the routes that query the database at request rates Next alone sustains;
    # 0.35 is the smallest limit measured that was not (docs/oci-setup.md,
    # "Axum's CPU limit"). Proxying a page costs it about 0.05 of a CPU.
    cpus: 0.35
    # Replaces the Next environment instead of merging into it.
    environment: !override
      PORT: "3000"
      UPSTREAM_URL: http://next:3001
      DATABASE_URL: postgresql://memecatch:${MEMECATCH_DB_PASSWORD}@postgres:5432/memecatch
      # The main pool. The deadline pool adds 2 and the plan pool of
      # /api/db/query 6: 12 in all (docs/axum-migration/PLAN.md, section 2).
      AXUM_DB_POOL_MAX: ${AXUM_DB_POOL_MAX:-4}
      AXUM_DISABLED_ROUTES: ${AXUM_DISABLED_ROUTES:-}
      # The native pages (server/README.md, "Pages") stay Next's until listed here.
      AXUM_PILOT_ROUTES: ${AXUM_PILOT_ROUTES:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      # As for the Next app: sign-out's trusted origins start from it
      # (server/src/routes/better_auth.rs). BETTER_AUTH_TRUSTED_ORIGINS is not
      # given to Next, so not here either.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://catchmeme.com}
      # As for the Next app: where sign-up and password reset post their mail
      # (server/src/routes/better_auth/mail.rs). Unset, both only log it.
      AUTH_EMAIL_WEBHOOK: ${AUTH_EMAIL_WEBHOOK:-}
      # The operator's GA4 report (server/src/pages/admin/ga4.rs), as
      # docker-compose.yml gives them to Next.
      GA4_PROPERTY_ID: ${GA4_PROPERTY_ID:-}
      GA4_SERVICE_ACCOUNT_EMAIL: ${GA4_SERVICE_ACCOUNT_EMAIL:-}
      GA4_SERVICE_ACCOUNT_PRIVATE_KEY: ${GA4_SERVICE_ACCOUNT_PRIVATE_KEY:-}
      # The operator's GPT drafts (server/src/routes/admin/openai.rs).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_REVIEW_BASE_URL: ${OPENAI_REVIEW_BASE_URL:-}
      # IndexNow after admin actions (server/src/routes/admin/indexnow.rs):
      # 1 stops it. docker-compose.yml does not pass it to Next, where it is
      # therefore always on in production.
      INDEXNOW_DISABLED: ${INDEXNOW_DISABLED:-}
      # As for the Next app: Google and Kakao sign-in (server/src/routes/
      # better_auth/oauth/). A provider without both values is not set, and
      # its start answers 404 as Next's does. AXUM_TEST_OAUTH_ORIGIN, which
      # replaces the providers' hosts in tests, is never passed.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      # As for the Next app: TikTok login (server/src/routes/better_auth/
      # tiktok/). Without the client key the start sends the browser back to
      # /login?error=auth, as Next's does. AXUM_TEST_OAUTH_ORIGIN replaces
      # TikTok's API host in tests too, and is never passed.
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_REDIRECT_URI: ${TIKTOK_REDIRECT_URI:-}
      # As for the Next app: both read the `__Secure-` session cookie.
      NODE_ENV: production
      CRON_SECRET: ${CRON_SECRET:-}
      # Keys the view counter and the analytics events (server/src/routes/
      # tracking.rs). Without it those two routes stay Next's.
      MEMECATCH_SIGNING_SECRET: ${MEMECATCH_SIGNING_SECRET:-}
      # The semantic search route (server/src/routes/search/) reads both, as
      # Next does. Without MEME_SEMANTIC_SEARCH_ENABLED it answers the keyword
      # fallback with reason "disabled" where Next says "model_unavailable".
      # The BEDROCK_* and AWS_* variables are not passed: the operator studio
      # stays Next's until its credential source is known (PLAN.md row 61).
      MEME_SEMANTIC_SEARCH_ENABLED: ${MEME_SEMANTIC_SEARCH_ENABLED:-}
      MEME_EMBEDDING_URL: ${MEME_EMBEDDING_URL:-}
      # The embedding routes (server/src/routes/embeddings.rs): the first two as
      # docker-compose.yml gives them to Next. MEME_EMBEDDER_URL is Axum's
      # own: http://embedder:8780 with the `embedder` profile on (the service
      # below). Unset, Axum answers as Next does without a model, which is
      # production today (PLAN.md, R12).
      MEME_EMBEDDING_RUNTIME: bundled
      MEME_EMBEDDING_REINDEX_ENABLED: ${MEME_EMBEDDING_REINDEX_ENABLED:-false}
      MEME_EMBEDDER_URL: ${MEME_EMBEDDER_URL:-}
      # The meme chat (server/src/routes/chat/) and the candidate draft
      # (server/src/routes/mpe/) read these as Next does. Without them Axum
      # answers the retrieved summary and 503 draft_provider_not_configured
      # even when Next has a key. server/tests/compose_env.rs fails when a
      # variable the server reads is missing here and not listed as left out.
      MEME_CHAT_GENERATION_ENABLED: ${MEME_CHAT_GENERATION_ENABLED:-}
      MEME_CHAT_PROVIDER: ${MEME_CHAT_PROVIDER:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      OPENROUTER_MPE_MODEL: ${OPENROUTER_MPE_MODEL:-}
      # The ChatGPT connector routes (server/src/routes/mcp/): the retry
      # cron's second bearer, the GitHub webhook secret, and the state key.
      # The key decides which server answers: without it (as production
      # has it: the operator MCP is not configured) Axum gives the fixed
      # answers the stateful routes give; with it Axum leaves them to Next,
      # which gets the same value above.
      MCP_EVENT_RETRY_TOKEN: ${MCP_EVENT_RETRY_TOKEN:-}
      MCP_GITHUB_WEBHOOK_SECRET: ${MCP_GITHUB_WEBHOOK_SECRET:-}
      MCP_EVENT_STATE_KEY: ${MCP_EVENT_STATE_KEY:-}
      # Read at run time by Next too (components/adsense-script.tsx).
      ADSENSE_AUTO_ADS_ENABLED: ${ADSENSE_AUTO_ADS_ENABLED:-}
      # The saved-state emails (server/src/routes/ops/saved_state.rs), as the
      # Next app gets them. Without the URL and sender the cron answers
      # not_configured, as Next does.
      PLUS_DIGEST_DELIVERY_TOKEN: ${PLUS_DIGEST_DELIVERY_TOKEN:-}
      PLUS_DIGEST_DELIVERY_URL: ${PLUS_DIGEST_DELIVERY_URL:-}
      PLUS_DIGEST_FROM_EMAIL: ${PLUS_DIGEST_FROM_EMAIL:-}
      # The trend pulse's radar connectors (server/src/routes/ops/radar_connectors.rs),
      # as docker-compose.yml gives them to Next. Without them Axum collects
      # nothing where Next would.
      RADAR_X_TERMS: ${RADAR_X_TERMS:-}
      X_API_BEARER_TOKEN: ${X_API_BEARER_TOKEN:-}
      RADAR_THREADS_TERMS: ${RADAR_THREADS_TERMS:-}
      THREADS_ACCESS_TOKEN: ${THREADS_ACCESS_TOKEN:-}
      RADAR_INSTAGRAM_HASHTAGS: ${RADAR_INSTAGRAM_HASHTAGS:-}
      META_INSTAGRAM_ACCESS_TOKEN: ${META_INSTAGRAM_ACCESS_TOKEN:-}
      META_INSTAGRAM_USER_ID: ${META_INSTAGRAM_USER_ID:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-}
      # The source refresh run's videos.list (server/src/routes/sources/youtube.rs),
      # as docker-compose.yml gives it to Next. Without it Axum's run fails its
      # YouTube part where Next's checks the videos. META_GRAPH_API_VERSION
      # above also picks the oEmbed endpoint version (server/src/oembed).
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      # RELEASE_SHA, NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_GA_ID,
      # NEXT_PUBLIC_ADSENSE_CLIENT, NEXT_PUBLIC_COMMUNITY_ENABLED and
      # NEXT_PUBLIC_SUBMISSIONS_OPEN are left out on purpose. Next fixes them
      # at build time, and Axum must run with the same ones for native routes
      # and pages to match. They are build args of both images, kept in the
      # image environment, so a release's two images agree whatever .env holds.
      # CSP_ENFORCE and CSP_REPORT_URI are left out too: the Next image is
      # built without them, and a runtime value does not change what Next
      # sends, so passing one here would make native routes differ.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      OBJECT_SIGNING_SECRET: ${OBJECT_SIGNING_SECRET:-}
      LOCAL_OBJECT_STORAGE_DIR: ${LOCAL_OBJECT_STORAGE_DIR:-}
    volumes: !reset []
    depends_on:
      postgres:
        condition: service_healthy
      next:
        condition: service_healthy
    healthcheck:
      # The runtime image has no curl or node; bash can open the socket.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3000 && printf 'GET /api/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 12

  # The embedding model in its own container (server/src/embedder/service.rs):
  # 470 MB of FP32 weights do not fit in Axum's 256 MB. Not started unless the
  # `embedder` profile is on (COMPOSE_PROFILES=embedder in .env, with
  # MEME_EMBEDDER_URL=http://embedder:8780); the model volume must hold the
  # pinned model first (PLAN.md, section R12, "운영에서 켜는 법"). Reached only
  # by `app` on the compose network; no port is published.
  embedder:
    profiles: [embedder]
    build:
      context: .
      dockerfile: Dockerfile.server
      target: embedder
    image: ${MEMECATCH_EMBEDDER_IMAGE:-memecatch-embedder:local}
    # Measured on linux/arm64 (PLAN.md, R12-6): 960 MiB at its peak while the
    # model loads, 640 MB after. Next peaks at 2.0 GB loading the same model.
    mem_limit: 1280m
    cpus: 0.5
    volumes:
      - memecatch-models:/models:ro
    networks: [memecatch]
    restart: unless-stopped
