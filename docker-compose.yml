name: memecatch

services:
  postgres:
    image: pgvector/pgvector:pg16
    mem_limit: 1280m
    cpus: 0.50
    shm_size: 256mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: memecatch
      MEMECATCH_DB_PASSWORD: ${MEMECATCH_DB_PASSWORD:?MEMECATCH_DB_PASSWORD is required}
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=30
      - -c
      - wal_buffers=8MB
    volumes:
      - memecatch-pg:/var/lib/postgresql/data
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./deploy/postgres/00-bootstrap.sql:/sql/00-bootstrap.sql:ro
      - ./deploy/postgres/99-app-identity.sql:/sql/99-app-identity.sql:ro
      - ./supabase/migrations:/migrations:ro
    networks: [memecatch]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d memecatch"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app:
    image: ${MEMECATCH_IMAGE:-memecatch:local}
    mem_limit: 2816m
    cpus: 0.75
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://memecatch:${MEMECATCH_DB_PASSWORD}@postgres:5432/memecatch
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://catchmeme.com}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://catchmeme.com}
      CRON_SECRET: ${CRON_SECRET:-}
      MEME_EMBEDDING_RUNTIME: bundled
      MEME_EMBEDDING_REINDEX_ENABLED: ${MEME_EMBEDDING_REINDEX_ENABLED:-true}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - memecatch-models:/app/.local/embedding-models
    networks: [memecatch]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mpe-worker:
    image: ${MEMECATCH_WORKER_IMAGE:-memecatch-worker:local}
    mem_limit: 768m
    cpus: 0.40
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://memecatch:${MEMECATCH_DB_PASSWORD}@postgres:5432/memecatch
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [memecatch]
    restart: unless-stopped

  scheduler:
    build:
      context: ./deploy/scheduler
    mem_limit: 64m
    cpus: 0.05
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    depends_on: [app]
    networks: [memecatch]
    restart: unless-stopped

  backup:
    build:
      context: ./deploy/backup
    mem_limit: 256m
    cpus: 0.10
    environment:
      DATABASE_URL: postgresql://memecatch:${MEMECATCH_DB_PASSWORD}@postgres:5432/memecatch
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BACKUP_BUCKET: ${R2_BACKUP_BUCKET:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [memecatch]
    restart: unless-stopped

networks:
  memecatch:
    name: memecatch

volumes:
  memecatch-pg:
    name: memecatch-pg
  memecatch-caddy:
    name: memecatch-caddy
  memecatch-models:
    name: memecatch-models
